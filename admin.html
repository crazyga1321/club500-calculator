<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>CLUB500 — Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background: #0b0f1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      padding: 40px;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      background: #4f7cff;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    pre {
      margin-top: 20px;
      background: #11162a;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
    }
  </style>
</head>
<body>

  <h1>CLUB500 — Admin Panel</h1>
  <button onclick="callRapid()">Вызвать rapid-processor</button>

  <pre id="output">Ожидание...</pre>

  <script>
    // === НАСТРОЙКИ SUPABASE ===
    const SUPABASE_URL = "https://jztydqlfaeopzjnuinlt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6dHlkcWxmYWVvcHpqbnVpbmx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MjkyNDksImV4cCI6MjA4NTIwNTI0OX0.saTBShE9daWjq3pR_aFG--fK7z1T5naWOTrQg4YHir8";

    async function callRapid() {
      const output = document.getElementById("output");
      output.textContent = "Запрос отправляется...";

      try {
        const response = await fetch(
          `${SUPABASE_URL}/functions/v1/rapid-processor`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
              "apikey": SUPABASE_ANON_KEY
            },
            body: JSON.stringify({
              source: "admin.html",
              test: true
            })
          }
        );

        const text = await response.text();

        output.textContent =
          `STATUS: ${response.status}\n\nRESPONSE:\n${text}`;

      } catch (err) {
        output.textContent = "ERROR:\n" + err.message;
      }
    }
  </script>

</body>
</html>
