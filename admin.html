<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>CLUB500 — Admin</title>
  <style>
    body {
      background: #0b0f19;
      color: #fff;
      font-family: Inter, Arial, sans-serif;
      padding: 40px;
    }
    button {
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
    pre {
      background: #111827;
      padding: 16px;
      border-radius: 12px;
      margin-top: 20px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h1>CLUB500 — Admin Stats</h1>

  <button onclick="loadAdminStats()">Загрузить статистику</button>

  <pre id="out">Нажми кнопку…</pre>

  <script>
    async function loadAdminStats() {
      const out = document.getElementById("out");
      out.textContent = "Запрос…";

      try {
        const r = await fetch(
          "https://jztvdlfaeopzinuinlt.supabase.co/functions/v1/admin-stats",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",

              /* 🔥🔥🔥 ВСТАВЬ СЮДА СЕКРЕТ 🔥🔥🔥 */
              "x-admin-secret": "J4v2WKNUgHVoCD7zSMeJsTiwqyAYNFEnrDw0RKXlO2ZvJHFifJhhySCdOhEnQx6V"
              /* 🔥🔥🔥 ТОЛЬКО ЭТУ СТРОКУ МЕНЯЕШЬ 🔥🔥🔥 */
            },
            body: JSON.stringify({ ping: true })
          }
        );

        const data = await r.json();
        out.textContent =
          "HTTP " + r.status + "\n\n" +
          JSON.stringify(data, null, 2);

      } catch (e) {
        out.textContent = "Ошибка:\n" + e.message;
      }
    }
  </script>

</body>
</html>
