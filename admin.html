<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CLUB500 — Admin</title>
  <style>
    body{background:#020617;color:#e5e7eb;font-family:system-ui;margin:0;padding:20px}
    table{width:100%;border-collapse:collapse;margin-top:20px}
    th,td{border-bottom:1px solid #334155;padding:10px;text-align:left}
    th{color:#94a3b8;font-size:12px}
    a{color:#38bdf8;text-decoration:none;font-weight:700}
    .top{display:flex;justify-content:space-between;align-items:center}
    .pill{padding:6px 10px;border-radius:999px;background:#0f172a;color:#e5e7eb;font-size:12px}
  </style>
</head>
<body>

<div class="top">
  <h2>CLUB500 — Admin</h2>
  <span class="pill" id="me"></span>
</div>

<table>
  <thead>
    <tr>
      <th>Пользователь</th>
      <th>Plan</th>
      <th>Admin</th>
      <th>Действие</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://jztydqlfaeopzjnuinlt.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6dHlkcWxmYWVvcHpqbnVpbmx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MjkyNDksImV4cCI6MjA4NTIwNTI0OX0.saTBShE9daWjq3pR_aFG--fK7z1T5naWOTrQg4YHir8";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const tbody = document.getElementById("tbody");
const me = document.getElementById("me");

(async () => {
  // 1. Проверяем сессию
  const { data: { session } } = await sb.auth.getSession();
  if (!session?.user) {
    alert("Нужно войти в ЛЧ");
    location.href = "index.html";
    return;
  }

  me.textContent = session.user.email;

  // 2. Запрос к Edge Function
  const res = await fetch(`${SUPABASE_URL}/functions/v1/rapid-processor`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${session.access_token}`
    },
    body: JSON.stringify({
      access_token: session.access_token
    })
  });

  const json = await res.json();

  if (!res.ok) {
    console.error(json);
    alert("Ошибка админки: " + (json.error || res.status));
    return;
  }

  // 3. Рендерим пользователей
  const users = json.users || [];
  tbody.innerHTML = users.map(u => `
    <tr>
      <td>
        <b>${u.name || ""}</b><br/>
        <small>${u.email}</small>
      </td>
      <td>${u.plan || ""}</td>
      <td>${u.is_admin ? "true" : "false"}</td>
      <td>
        <a href="admin-user.html?id=${u.user_id}">Открыть</a>
      </td>
    </tr>
  `).join("");
})();
</script>
</body>
</html>
