<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CLUB500 — Admin User</title>
  <style>
    :root{
      --bg:#020617; --panel:rgba(2,6,23,.72); --border:rgba(148,163,184,.18);
      --text:rgba(226,232,240,.95); --muted:rgba(148,163,184,.95);
    }
    html,body{height:100%;}
    body{margin:0;background:radial-gradient(1200px 700px at 20% 0%, rgba(56,189,248,.10), transparent 55%),
                     radial-gradient(1000px 600px at 80% 20%, rgba(167,139,250,.10), transparent 55%),
                     var(--bg);
         color:var(--text); font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial;}
    .wrap{max-width:1100px;margin:24px auto;padding:0 14px;}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
    .brand{display:flex;flex-direction:column;gap:2px}
    .brand b{font-size:16px;letter-spacing:.2px}
    .brand span{color:var(--muted);font-size:12px}
    .btn{height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--border);
         background:rgba(2,6,23,.35);color:var(--text);font-weight:900;cursor:pointer}
    .btn.primary{border-color:rgba(34,211,238,.28);background:rgba(34,211,238,.10)}
    .card{border:1px solid var(--border);background:var(--panel);border-radius:18px;padding:14px;box-shadow:0 24px 80px rgba(0,0,0,.45)}
    .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:6px 10px;color:var(--muted);font-size:12px}
    .small{font-size:12px;color:var(--muted)}
    table{width:100%;border-collapse:separate;border-spacing:0;margin-top:12px;overflow:hidden;border-radius:14px}
    th,td{padding:10px 10px;border-bottom:1px solid rgba(148,163,184,.12);text-align:left;vertical-align:top}
    th{color:var(--muted);font-size:12px;font-weight:800;background:rgba(2,6,23,.35)}
    tr:hover td{background:rgba(148,163,184,.04)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    @media (max-width: 900px){ .grid{grid-template-columns:1fr;} }
    pre{white-space:pre-wrap;word-break:break-word;margin:0}
    a{color:rgba(56,189,248,.95);text-decoration:none;font-weight:900}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <b><a href="admin.html">← CLUB500 — Admin</a></b>
      <span id="subtitle">Детали пользователя</span>
    </div>
    <div class="row">
      <span class="pill" id="mePill" style="display:none"></span>
      <button class="btn" id="btnReload" type="button">Обновить</button>
      <button class="btn" id="btnLogout" type="button">Выйти</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <div class="small">User ID</div>
        <div><b id="uid">—</b></div>
      </div>
      <div>
        <div class="small">Статус</div>
        <div id="status"><b>Загрузка…</b></div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <b>Профиль</b>
        <div class="small" style="margin-top:8px"><pre id="profile">—</pre></div>
      </div>
      <div class="card">
        <b>Аккаунт</b>
        <div class="small" style="margin-top:8px"><pre id="account">—</pre></div>
      </div>
    </div>

    <div class="card" style="margin-top:12px">
      <b>Сделки (последние 300)</b>
      <table>
        <thead>
          <tr>
            <th>Дата</th>
            <th>Актив</th>
            <th>Сторона</th>
            <th>Qty</th>
            <th>Price</th>
            <th>PnL</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="small" style="margin-top:8px" id="tradesHint"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // CONFIG
  const SUPABASE_URL = "https://jztydqlfaeopzjnuinlt.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6dHlkcWxmYWVvcHpqbnVpbmx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MjkyNDksImV4cCI6MjA4NTIwNTI0OX0.saTBShE9daWjq3pR_aFG--fK7z1T5naWOTrQg4YHir8";
  const EDGE_FN = "rapid-processor";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (id)=>document.getElementById(id);

  const uidEl = $("uid"), statusEl = $("status"), mePill = $("mePill");
  const profileEl = $("profile"), accountEl = $("account"), tbody = $("tbody"), tradesHint = $("tradesHint");
  const btnReload = $("btnReload"), btnLogout = $("btnLogout");

  function qp(name){
    const u = new URL(location.href);
    return u.searchParams.get(name);
  }

  function pretty(x){
    try{ return JSON.stringify(x, null, 2); }catch(_){ return String(x); }
  }

  async function callEdge(payload){
    const { data: { session } } = await sb.auth.getSession();
    if(!session?.access_token) throw new Error("Нет сессии. Войди в ЛК.");

    const res = await fetch(`${SUPABASE_URL}/functions/v1/${EDGE_FN}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY
      },
      body: JSON.stringify({
        access_token: session.access_token,
        ...(payload || {})
      })
    });

    const json = await res.json().catch(()=> ({}));
    if(!res.ok){
      const msg = json?.error || json?.message || ("HTTP " + res.status);
      throw new Error(msg);
    }
    return json;
  }

  async function boot(){
    const { data: { session } } = await sb.auth.getSession();
    if(!session?.user){
      location.href = "index.html";
      return;
    }
    mePill.style.display = "inline-flex";
    mePill.textContent = session.user.email || "";
  }

  async function load(){
    const id = qp("id");
    uidEl.textContent = id || "—";
    if(!id){
      statusEl.innerHTML = "<b>Нет параметра ?id=</b>";
      return;
    }

    statusEl.innerHTML = "<b>Загрузка…</b>";
    profileEl.textContent = "—";
    accountEl.textContent = "—";
    tbody.innerHTML = "";
    tradesHint.textContent = "";

    try{
      const out = await callEdge({ id });

      profileEl.textContent = pretty(out.profile);
      accountEl.textContent = pretty(out.account);

      const trades = out.trades || [];
      if(!trades.length){
        tbody.innerHTML = `<tr><td colspan="6" class="small">Сделок нет.</td></tr>`;
      } else {
        tbody.innerHTML = trades.map(t=>{
          const dt = t.created_at ? new Date(t.created_at).toLocaleString() : "";
          const sym = t.symbol || t.asset || t.ticker || "";
          const side = t.side || t.type || "";
          const qty = t.qty ?? t.amount ?? "";
          const price = t.price ?? "";
          const pnl = t.pnl ?? t.pnl_usd ?? "";
          return `<tr>
            <td class="small">${dt}</td>
            <td>${sym}</td>
            <td class="small">${side}</td>
            <td class="small">${qty}</td>
            <td class="small">${price}</td>
            <td class="small">${pnl}</td>
          </tr>`;
        }).join("");
      }

      statusEl.innerHTML = "<b>OK</b>";
    }catch(e){
      statusEl.innerHTML = "<b style='color:#fda4af'>Ошибка</b>";
      tradesHint.textContent = "Ошибка: " + (e?.message || String(e));
      tbody.innerHTML = `<tr><td colspan="6" class="small">${(e?.message || String(e))}</td></tr>`;
    }
  }

  btnReload.addEventListener("click", ()=>load());
  btnLogout.addEventListener("click", async ()=>{
    await sb.auth.signOut();
    location.href = "index.html";
  });

  (async ()=>{
    await boot();
    await load();
  })();
</script>
</body>
</html>
